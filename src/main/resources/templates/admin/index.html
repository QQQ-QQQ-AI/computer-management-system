<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('经营概览')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('admin','index')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('经营概览')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="stat-grid">
                <div class="stat">
                    <div class="label">今日营业收入</div>
                    <div class="value">
                        <span th:text="${#numbers.formatDecimal(today.totalRevenue, 1, 2)}">0.00</span>
                        <span class="unit">元</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="label">今日上机人次</div>
                    <div class="value small" th:text="${today.sessionCount}">0</div>
                </div>
                <div class="stat">
                    <div class="label">在机中</div>
                    <div class="value small" style="color:#a32d2d"
                         th:text="${statusCount['USING']}">0</div>
                </div>
                <div class="stat">
                    <div class="label">会员总数</div>
                    <div class="value small" th:text="${memberCount}">0</div>
                </div>
                <div class="stat">
                    <div class="label">商品种类</div>
                    <div class="value small" th:text="${productCount}">0</div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card-box">
                        <h6>近 7 天收入趋势</h6>
                        <div id="trendChart" class="chart"></div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card-box">
                        <h6>近 7 天各区域上机收入占比</h6>
                        <div id="areaChart" class="chart"></div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-6">
                    <div class="card-box">
                        <h6>各区域机位情况</h6>
                        <table class="table table-sm mb-0">
                            <thead>
                            <tr>
                                <th>区域</th>
                                <th class="text-end">机位总数</th>
                                <th class="text-end">空闲</th>
                                <th class="text-end">使用中</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="a : ${areaStats}">
                                <td th:text="${a['area']}">普通区</td>
                                <td class="text-end" th:text="${a['total']}">0</td>
                                <td class="text-end" th:text="${a['freeCount']}">0</td>
                                <td class="text-end" th:text="${a['usingCount']}">0</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card-box">
                        <h6>今日收入构成</h6>
                        <table class="table table-sm mb-0">
                            <tbody>
                            <tr>
                                <td class="hint">上机收入</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(today.hourFee, 1, 2)} + ' 元'">0.00</td>
                            </tr>
                            <tr>
                                <td class="hint">商品收入</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(today.productFee, 1, 2)} + ' 元'">0.00</td>
                            </tr>
                            <tr>
                                <td class="hint">设备租赁收入</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(today.rentalFee, 1, 2)} + ' 元'">0.00</td>
                            </tr>
                            <tr>
                                <td class="hint">今日充值（预收款，不计入收入）</td>
                                <td class="text-end hint" th:text="${#numbers.formatDecimal(today.rechargeAmount, 1, 2)} + ' 元'">0.00</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card-box">
                        <h6>在机上机中（<span th:text="${#lists.size(usingList)}">0</span> 台）</h6>
                        <div th:if="${#lists.isEmpty(usingList)}" class="empty">当前没有顾客在上机</div>
                        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(usingList)}">
                            <thead>
                            <tr>
                                <th>机位</th>
                                <th>会员</th>
                                <th>开台时间</th>
                                <th class="text-end">已上机</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="s : ${usingList}">
                                <td th:text="${s.seatNo} + ' · ' + ${s.area}">A01</td>
                                <td th:text="${s.memberName}">会员</td>
                                <td th:text="${#temporals.format(s.startTime, 'MM-dd HH:mm')}">-</td>
                                <td class="text-end" th:text="${elapsed[s.id]}">0 时 0 分</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card-box">
                        <h6>机位状态总览</h6>
                        <table class="table table-sm mb-0">
                            <tbody>
                            <tr>
                                <td class="hint">空闲</td>
                                <td class="text-end" th:text="${statusCount['FREE']} + ' 台'">0 台</td>
                            </tr>
                            <tr>
                                <td class="hint">使用中</td>
                                <td class="text-end" th:text="${statusCount['USING']} + ' 台'">0 台</td>
                            </tr>
                            <tr>
                                <td class="hint">维护中</td>
                                <td class="text-end" th:text="${statusCount['MAINTENANCE']} + ' 台'">0 台</td>
                            </tr>
                            </tbody>
                        </table>
                        <div class="mt-3">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/seat}">前往机位管理</a>
                            <a class="btn btn-sm btn-primary" th:href="@{/admin/stats}">查看完整报表</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 图表数据通过 data 属性传递，避免 Thymeleaf 内联对 JSON 的二次转义 -->
<div id="chartData" style="display:none"
     th:attr="data-trend=${trendJson},data-area=${areaJson}"></div>

<div th:replace="~{layout/base :: scripts}"></div>
<div th:replace="~{layout/base :: scriptsChart}"></div>
<script>
    (function () {
        var el = document.getElementById('chartData');
        var trend = JSON.parse(el.dataset.trend || '[]');
        var area = JSON.parse(el.dataset.area || '[]');

        if (trend.length) {
            echarts.init(document.getElementById('trendChart')).setOption({
                tooltip: {trigger: 'axis'},
                legend: {data: ['上机收入', '商品收入', '租赁收入'], top: 0},
                grid: {left: 44, right: 16, top: 42, bottom: 28},
                xAxis: {type: 'category', data: trend.map(function (d) { return d.label; })},
                yAxis: {type: 'value', name: '元'},
                series: [
                    {name: '上机收入', type: 'line', smooth: true, data: trend.map(function (d) { return d.hourFee; })},
                    {name: '商品收入', type: 'line', smooth: true, data: trend.map(function (d) { return d.productFee; })},
                    {name: '租赁收入', type: 'line', smooth: true, data: trend.map(function (d) { return d.rentFee; })}
                ]
            });
        }

        if (area.length) {
            echarts.init(document.getElementById('areaChart')).setOption({
                tooltip: {trigger: 'item', formatter: '{b}：{c} 元（{d}%）'},
                legend: {bottom: 0},
                series: [{
                    type: 'pie', radius: ['42%', '68%'], center: ['50%', '46%'],
                    data: area, avoidLabelOverlap: true,
                    label: {formatter: '{b}\n{d}%'}
                }]
            });
        }
    })();
</script>
</body>
</html>
