<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('商品管理')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('admin','product')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('商品管理')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="card-box">
                <h6>商品查询</h6>
                <form method="get" th:action="@{/admin/product}" class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label class="form-label">商品名称</label>
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}">
                    </div>
                    <div class="col-auto">
                        <label class="form-label">上架状态</label>
                        <select class="form-select" name="status">
                            <option value="" th:selected="${status == null}">全部</option>
                            <option value="1" th:selected="${status != null and status == 1}">已上架</option>
                            <option value="0" th:selected="${status != null and status == 0}">已下架</option>
                        </select>
                    </div>
                    <div class="col-auto"><button type="submit" class="btn btn-primary">查询</button></div>
                    <div class="col-auto">
                        <a class="btn btn-outline-secondary" th:href="@{/admin/product}">重置</a>
                    </div>
                </form>
            </div>

            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="card-box">
                        <h6 id="formTitle">新增商品</h6>
                        <form method="post" th:action="@{/admin/product/save}" id="productForm">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" id="pid">
                            <div class="mb-3">
                                <label class="form-label" for="name">商品名称 <span style="color:#dc2626">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required maxlength="64">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="price">单价（元） <span style="color:#dc2626">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="stock">库存数量</label>
                                <input type="number" min="0" class="form-control" id="stock" name="stock" value="0">
                            </div>
                            <button type="submit" class="btn btn-primary">保存</button>
                            <button type="button" class="btn btn-outline-secondary" id="resetBtn">清空</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card-box">
                        <h6>商品列表（共 <span th:text="${page.total}">0</span> 种）</h6>
                        <div th:if="${#lists.isEmpty(page.records)}" class="empty">暂无商品</div>
                        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(page.records)}">
                            <thead>
                            <tr>
                                <th>名称</th>
                                <th class="text-end">单价</th>
                                <th class="text-end">库存</th>
                                <th>状态</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${page.records}"
                                th:attr="data-id=${p.id},data-name=${p.name},data-price=${p.price},data-stock=${p.stock}">
                                <td th:text="${p.name}">商品</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</td>
                                <td class="text-end">
                                    <span th:if="${p.stock > 0}" th:text="${p.stock}">0</span>
                                    <span class="badge-soft bs-red" th:if="${p.stock <= 0}">售罄</span>
                                </td>
                                <td>
                                    <span class="badge-soft bs-green" th:if="${p.status == 1}">已上架</span>
                                    <span class="badge-soft bs-gray" th:if="${p.status != 1}">已下架</span>
                                </td>
                                <td style="white-space:nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary edit-btn">编辑</button>
                                    <form method="post" th:action="@{/admin/product/status}" style="display:inline">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="id" th:value="${p.id}">
                                        <input type="hidden" name="status" th:value="${p.status == 1} ? 0 : 1">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                                th:text="${p.status == 1} ? '下架' : '上架'">下架</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="hint"
                                 th:text="'共 ' + ${page.total} + ' 条，第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></div>
                            <div>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:classappend="${page.current <= 1} ? 'disabled'"
                                   th:href="@{/admin/product(page=${page.current - 1}, keyword=${keyword}, status=${status})}">上一页</a>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:classappend="${page.current >= page.pages} ? 'disabled'"
                                   th:href="@{/admin/product(page=${page.current + 1}, keyword=${keyword}, status=${status})}">下一页</a>
                            </div>
                        </div>

                        <div class="hint mt-3 pt-3" style="border-top:1px dashed #e5e7eb">
                            库存由商品记账自动扣减，带库存条件的更新可避免并发超卖。
                            <strong>下架</strong>的商品不出现在收银台的商品记账列表中，但不影响历史订单。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    document.querySelectorAll('.edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var tr = this.closest('tr');
            document.getElementById('pid').value = tr.dataset.id;
            document.getElementById('name').value = tr.dataset.name;
            document.getElementById('price').value = tr.dataset.price;
            document.getElementById('stock').value = tr.dataset.stock;
            document.getElementById('formTitle').textContent = '编辑「' + tr.dataset.name + '」';
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
        document.getElementById('productForm').reset();
        document.getElementById('pid').value = '';
        document.getElementById('formTitle').textContent = '新增商品';
    });
</script>
</body>
</html>
