<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('设备管理')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('admin','equipment')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('设备管理')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="card-box">
                <h6>设备查询</h6>
                <form method="get" th:action="@{/admin/equipment}" class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label class="form-label">编号 / 类别</label>
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}">
                    </div>
                    <div class="col-auto">
                        <label class="form-label">状态</label>
                        <select class="form-select" name="status">
                            <option value="" th:selected="${status == null}">全部</option>
                            <option value="IN_STOCK" th:selected="${status == 'IN_STOCK'}">在库</option>
                            <option value="RENTED" th:selected="${status == 'RENTED'}">已租出</option>
                            <option value="REPAIR" th:selected="${status == 'REPAIR'}">维修中</option>
                        </select>
                    </div>
                    <div class="col-auto"><button type="submit" class="btn btn-primary">查询</button></div>
                    <div class="col-auto">
                        <a class="btn btn-outline-secondary" th:href="@{/admin/equipment}">重置</a>
                    </div>
                </form>
            </div>

            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="card-box">
                        <h6 id="formTitle">新增设备</h6>
                        <form method="post" th:action="@{/admin/equipment/save}" id="eqForm">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" id="eid">
                            <div class="mb-3">
                                <label class="form-label" for="code">设备编号 <span style="color:#dc2626">*</span></label>
                                <input type="text" class="form-control" id="code" name="code" required maxlength="32"
                                       placeholder="如 EQ-006">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="category">设备类别 <span style="color:#dc2626">*</span></label>
                                <input type="text" class="form-control" id="category" name="category" required maxlength="32"
                                       placeholder="如 机械键盘、游戏鼠标">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label" for="rentPrice">日租金（元）</label>
                                    <input type="number" step="0.01" min="0" class="form-control"
                                           id="rentPrice" name="rentPrice" value="0.00">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label" for="deposit">押金（元）</label>
                                    <input type="number" step="0.01" min="0" class="form-control"
                                           id="deposit" name="deposit" value="0.00">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">保存</button>
                            <button type="button" class="btn btn-outline-secondary" id="resetBtn">清空</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card-box">
                        <h6>设备列表（共 <span th:text="${page.total}">0</span> 台）</h6>
                        <div th:if="${#lists.isEmpty(page.records)}" class="empty">暂无设备</div>
                        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(page.records)}">
                            <thead>
                            <tr>
                                <th>编号</th>
                                <th>类别</th>
                                <th class="text-end">日租金</th>
                                <th class="text-end">押金</th>
                                <th>状态</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="e : ${page.records}"
                                th:attr="data-id=${e.id},data-code=${e.code},data-category=${e.category},
                                         data-rent=${e.rentPrice},data-deposit=${e.deposit}">
                                <td th:text="${e.code}">EQ-001</td>
                                <td th:text="${e.category}">机械键盘</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(e.rentPrice, 1, 2)}">0.00</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(e.deposit, 1, 2)}">0.00</td>
                                <td>
                                    <span class="badge-soft bs-green" th:if="${e.status == 'IN_STOCK'}">在库</span>
                                    <span class="badge-soft bs-amber" th:if="${e.status == 'RENTED'}">已租出</span>
                                    <span class="badge-soft bs-gray" th:if="${e.status == 'REPAIR'}">维修中</span>
                                </td>
                                <td style="white-space:nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary edit-btn">编辑</button>
                                    <form method="post" th:action="@{/admin/equipment/status}" style="display:inline"
                                          th:if="${e.status != 'RENTED'}"
                                          onsubmit="return confirm('确认变更设备状态？');">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="id" th:value="${e.id}">
                                        <input type="hidden" name="status"
                                               th:value="${e.status == 'IN_STOCK'} ? 'REPAIR' : 'IN_STOCK'">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                                th:text="${e.status == 'IN_STOCK'} ? '转维修' : '恢复在库'">转维修</button>
                                    </form>
                                    <span class="hint" th:if="${e.status == 'RENTED'}">租借中不可改</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="hint"
                                 th:text="'共 ' + ${page.total} + ' 条，第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></div>
                            <div>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:classappend="${page.current <= 1} ? 'disabled'"
                                   th:href="@{/admin/equipment(page=${page.current - 1}, keyword=${keyword}, status=${status})}">上一页</a>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:classappend="${page.current >= page.pages} ? 'disabled'"
                                   th:href="@{/admin/equipment(page=${page.current + 1}, keyword=${keyword}, status=${status})}">下一页</a>
                            </div>
                        </div>
                    </div>

                    <div class="card-box">
                        <h6>借出未归还（<span th:text="${#lists.size(renting)}">0</span> 条）</h6>
                        <div th:if="${#lists.isEmpty(renting)}" class="empty">当前没有借出未归还的设备</div>
                        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(renting)}">
                            <thead>
                            <tr>
                                <th>会员</th>
                                <th>设备</th>
                                <th>租借时间</th>
                                <th class="text-end">冻结押金</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${renting}">
                                <td th:text="${r.memberName} + '（' + ${r.cardNo} + '）'">会员</td>
                                <td th:text="${r.category} + ' ' + ${r.equipmentCode}">设备</td>
                                <td th:text="${#temporals.format(r.rentTime, 'yyyy-MM-dd HH:mm')}">-</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(r.deposit, 1, 2)} + ' 元'">0.00 元</td>
                            </tr>
                            </tbody>
                        </table>
                        <div class="hint mt-3">
                            归还由收银员在「租赁办理」中操作；归还时解冻押金并按租期扣收租金。
                            <strong>「已租出」状态不能手工设置</strong>，只能由租借办理产生。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    document.querySelectorAll('.edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var tr = this.closest('tr');
            document.getElementById('eid').value = tr.dataset.id;
            document.getElementById('code').value = tr.dataset.code;
            document.getElementById('category').value = tr.dataset.category;
            document.getElementById('rentPrice').value = tr.dataset.rent;
            document.getElementById('deposit').value = tr.dataset.deposit;
            document.getElementById('formTitle').textContent = '编辑设备 ' + tr.dataset.code;
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
        document.getElementById('eqForm').reset();
        document.getElementById('eid').value = '';
        document.getElementById('formTitle').textContent = '新增设备';
    });
</script>
</body>
</html>
