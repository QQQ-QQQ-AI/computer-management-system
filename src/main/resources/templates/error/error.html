<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>出错了 - 网咖管理系统</title>
    <!--
      样式内联，不依赖任何 CDN。
      答辩或演示环境可能没有外网，外链样式一旦加载失败页面会变成白板，
      错误页尤其不应该再有这种依赖。
    -->
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            color: #1f2937;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        }
        .card {
            width: 460px;
            max-width: 92vw;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 36px 32px;
            text-align: center;
        }
        .code {
            font-size: 52px;
            font-weight: 500;
            color: #185fa5;
            line-height: 1;
            margin-bottom: 14px;
        }
        .title { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
        .msg {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 24px;
            word-break: break-all;
        }
        .btn {
            display: inline-block;
            padding: 8px 20px;
            font-size: 13px;
            color: #fff;
            background: #185fa5;
            border-radius: 6px;
            text-decoration: none;
        }
        .btn:hover { background: #0c447c; }
    </style>
</head>
<body>
<div class="card">
    <div class="code" th:text="${code} ?: '500'">500</div>
    <div class="title">页面出了点问题</div>
    <div class="msg" th:text="${msg} ?: '系统繁忙，请稍后重试。'">系统繁忙，请稍后重试。</div>
    <a class="btn" th:href="@{/login}">返回登录页</a>
</div>
</body>
</html>
