<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('会员首页')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('member','index')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('首页概览')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <!-- 账户概览 -->
            <div class="stat-grid">
                <div class="stat">
                    <div class="label">账户余额</div>
                    <div class="value">
                        <span th:text="${#numbers.formatDecimal(member.balance, 1, 2)}">0.00</span>
                        <span class="unit">元</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="label">冻结押金</div>
                    <div class="value small">
                        <span th:text="${#numbers.formatDecimal(member.deposit, 1, 2)}">0.00</span>
                        <span class="unit">元</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="label">会员等级</div>
                    <div class="value small" th:text="${member.levelName}">普通</div>
                </div>
                <div class="stat">
                    <div class="label">会员卡号</div>
                    <div class="value small" style="font-size:15px" th:text="${member.cardNo}">M0000</div>
                </div>
            </div>

            <!-- 进行中的上机 -->
            <div class="card-box" th:if="${activeSession != null}">
                <h6>当前上机中</h6>
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div style="font-size:15px">
                            机位 <strong th:text="${activeSession.seatNo}">A01</strong>
                            <span class="hint" th:if="${activeSession.area != null}"
                                  th:text="'（' + ${activeSession.area} + '）'"></span>
                            　开台时间
                            <span th:text="${#temporals.format(activeSession.startTime, 'yyyy-MM-dd HH:mm')}">-</span>
                        </div>
                        <div class="hint mt-1">下机时请到前台办理结算，上机费与商品消费将一并结清。</div>
                    </div>
                    <a class="btn btn-sm btn-primary" th:href="@{/member/sessions}">查看记录</a>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card-box">
                        <h6>最近上机记录</h6>
                        <div th:if="${#lists.isEmpty(recentSessions)}" class="empty">暂无上机记录</div>
                        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(recentSessions)}">
                            <thead>
                            <tr>
                                <th>机位</th>
                                <th>开台时间</th>
                                <th class="text-end">时长</th>
                                <th class="text-end">金额</th>
                                <th>状态</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="s : ${recentSessions}">
                                <td th:text="${s.seatNo}">A01</td>
                                <td th:text="${#temporals.format(s.startTime, 'MM-dd HH:mm')}">-</td>
                                <td class="text-end" th:text="${s.durationMinutes != null} ? ${s.durationMinutes} + ' 分钟' : '—'">—</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(s.totalFee, 1, 2)}">0.00</td>
                                <td>
                                    <span class="badge-soft bs-green" th:if="${s.status == 'FINISHED'}">已结算</span>
                                    <span class="badge-soft bs-red" th:if="${s.status == 'USING'}">使用中</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div class="mt-3">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/member/sessions}">查看全部</a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card-box">
                        <h6>门店公告</h6>
                        <div th:if="${#lists.isEmpty(notices)}" class="empty">暂无公告</div>
                        <div th:each="n, it : ${notices}" th:if="${it.index < 3}" class="mb-3">
                            <div style="font-size:13.5px;font-weight:500" th:text="${n.title}">标题</div>
                            <div class="hint mt-1" th:text="${#strings.abbreviate(n.content, 60)}">内容</div>
                        </div>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/member/notices}">查看全部公告</a>
                    </div>

                    <div class="card-box">
                        <h6>快捷入口</h6>
                        <div class="d-grid gap-2">
                            <a class="btn btn-primary btn-sm" th:href="@{/member/recharge}">在线充值</a>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/member/reservation}">在线预约机位</a>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/member/rentals}">外设租赁</a>
                            <a class="btn btn-outline-secondary btn-sm" th:href="@{/member/balance}">账户流水</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
