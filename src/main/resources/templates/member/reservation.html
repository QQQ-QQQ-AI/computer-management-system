<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('在线预约')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('member','reservation')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('在线预约')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <!-- 当前有效的预约 -->
            <div class="card-box" th:if="${!#lists.isEmpty(activeList)}">
                <h6>我的有效预约</h6>
                <table class="table table-sm mb-0">
                    <thead>
                    <tr>
                        <th>预约单号</th>
                        <th>机位</th>
                        <th>区域</th>
                        <th>到店时段</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${activeList}">
                        <td th:text="${r.code}">R0001</td>
                        <td th:text="${r.seatNo}">A01</td>
                        <td th:text="${r.area}">普通区</td>
                        <td th:text="${#temporals.format(r.startTime, 'yyyy-MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(r.endTime, 'HH:mm')}">-</td>
                        <td>
                            <form method="post" th:action="@{/member/reservation/cancel}" style="display:inline"
                                  onsubmit="return confirm('确认取消该预约？');">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${r.id}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">取消预约</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="card-box">
                        <h6>提交新预约</h6><p class="hint">请在开始前后15分钟内到前台核销并开台，超过宽限期或预约结束时间自动取消。</p>
                        <form method="post" th:action="@{/member/reservation}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label class="form-label" for="seatId">选择机位</label>
                                <select class="form-select" id="seatId" name="seatId" required>
                                    <option value="">请选择机位</option>
                                    <option th:each="s : ${seatList}" th:value="${s.id}"
                                            th:disabled="${s.status == 'MAINTENANCE'}"
                                            th:text="${s.seatNo} + ' · ' + ${s.area}
                                                     + (${s.status == 'MAINTENANCE'} ? '（维护中）'
                                                     : (${s.status == 'USING'} ? '（使用中，仍可预约其他时段）' : ''))">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="startTime">到店时间</label>
                                <input type="datetime-local" class="form-control" id="startTime" name="startTime" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="endTime">预计结束时间</label>
                                <input type="datetime-local" class="form-control" id="endTime" name="endTime" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">提交预约</button>
                        </form>

                        <div class="hint mt-3 pt-3" style="border-top:1px dashed #e5e7eb">
                            系统会检测该机位在所选时段是否已被占用，冲突时会提示另选。
                            提交后请按时到店，由前台核销预约后开台。
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card-box">
                        <h6>预约历史</h6>
                        <div th:if="${#lists.isEmpty(page.records)}" class="empty">暂无预约记录</div>
                        <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(page.records)}">
                            <thead>
                            <tr>
                                <th>预约单号</th>
                                <th>机位</th>
                                <th>到店时段</th>
                                <th>状态</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${page.records}">
                                <td th:text="${r.code}">R0001</td>
                                <td th:text="${r.seatNo}">A01</td>
                                <td th:text="${#temporals.format(r.startTime, 'MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(r.endTime, 'MM-dd HH:mm')}">-</td>
                                <td>
                                    <span class="badge-soft bs-amber" th:if="${r.status == 'PENDING'}">待核销</span>
                                    <span class="badge-soft bs-green" th:if="${r.status == 'USED'}">已核销</span>
                                    <span class="badge-soft bs-gray" th:if="${r.status == 'CANCELED'}">已取消</span>
                                    <span class="badge-soft bs-gray" th:if="${r.status == 'EXPIRED'}">已过期</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="hint"
                                 th:text="'共 ' + ${page.total} + ' 条，第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></div>
                            <div>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:classappend="${page.current <= 1} ? 'disabled'"
                                   th:href="@{/member/reservation(page=${page.current - 1})}">上一页</a>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:classappend="${page.current >= page.pages} ? 'disabled'"
                                   th:href="@{/member/reservation(page=${page.current + 1})}">下一页</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    // 默认填入「1 小时后 ~ 3 小时后」，省去用户逐个选择日期
    (function () {
        function fmt(d) {
            var p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
                + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
        }
        var now = new Date();
        document.getElementById('startTime').value = fmt(new Date(now.getTime() + 3600 * 1000));
        document.getElementById('endTime').value = fmt(new Date(now.getTime() + 3 * 3600 * 1000));
    })();
</script>
</body>
</html>
