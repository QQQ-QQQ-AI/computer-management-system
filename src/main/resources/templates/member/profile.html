<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('个人资料')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('member','profile')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('个人资料')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="row g-3">
                <div class="col-lg-6">
                    <div class="card-box">
                        <h6>会员信息</h6>
                        <table class="table table-sm mb-0">
                            <tbody>
                            <tr>
                                <td class="hint" style="width:120px">会员卡号</td>
                                <td th:text="${member.cardNo}">M0000</td>
                            </tr>
                            <tr>
                                <td class="hint">姓名</td>
                                <td th:text="${member.name}">姓名</td>
                            </tr>
                            <tr>
                                <td class="hint">手机号</td>
                                <td th:text="${member.phone}">13800000000</td>
                            </tr>
                            <tr>
                                <td class="hint">会员等级</td>
                                <td>
                                    <span th:text="${member.levelName}">普通</span>
                                    <span class="hint" th:if="${member.levelDiscount != null}"
                                          th:text="'（等级折扣 ' + ${member.levelDiscount} + '）'"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="hint">账户余额</td>
                                <td th:text="${#numbers.formatDecimal(member.balance, 1, 2)} + ' 元'">0.00 元</td>
                            </tr>
                            <tr>
                                <td class="hint">冻结押金</td>
                                <td th:text="${#numbers.formatDecimal(member.deposit, 1, 2)} + ' 元'">0.00 元</td>
                            </tr>
                            <tr>
                                <td class="hint">开卡时间</td>
                                <td th:text="${#temporals.format(member.createTime, 'yyyy-MM-dd HH:mm')}">-</td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="hint mt-3 pt-3" style="border-top:1px dashed #e5e7eb">
                            手机号与姓名的修改请到前台办理，以保证账户实名信息准确。
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card-box">
                        <h6>修改密码</h6>
                        <form method="post" th:action="@{/member/profile/password}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label class="form-label" for="oldPassword">原密码</label>
                                <input type="password" class="form-control" id="oldPassword"
                                       name="oldPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="newPassword">新密码</label>
                                <input type="password" class="form-control" id="newPassword"
                                       name="newPassword" required minlength="6" placeholder="至少 6 位">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="confirmPassword">确认新密码</label>
                                <input type="password" class="form-control" id="confirmPassword"
                                       name="confirmPassword" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary" id="pwdBtn">修改密码</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    document.getElementById('pwdBtn').closest('form').addEventListener('submit', function (e) {
        if (document.getElementById('newPassword').value
            !== document.getElementById('confirmPassword').value) {
            e.preventDefault();
            alert('两次输入的新密码不一致');
        }
    });
</script>
</body>
</html>
