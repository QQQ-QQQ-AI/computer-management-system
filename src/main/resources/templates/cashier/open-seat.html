<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('开台上机')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('cashier','open-seat')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('开台上机')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="card-box">
                        <h6>步骤一：读取会员</h6>
                        <form method="get" th:action="@{/cashier/open-seat}">
                            <div class="input-group">
                                <input type="text" class="form-control" name="cardNo"
                                       th:value="${cardNo}" placeholder="扫描或输入会员卡号" required>
                                <button type="submit" class="btn btn-outline-primary">查询</button>
                            </div>
                        </form>

                        <div th:if="${member != null}" class="mt-3 pt-3" style="border-top:1px solid #f1f3f5">
                            <table class="table table-sm mb-0">
                                <tbody>
                                <tr>
                                    <td class="hint" style="width:100px">会员</td>
                                    <td th:text="${member.name}">姓名</td>
                                </tr>
                                <tr>
                                    <td class="hint">卡号</td>
                                    <td th:text="${member.cardNo}">M0000</td>
                                </tr>
                                <tr>
                                    <td class="hint">等级</td>
                                    <td>
                                        <span th:text="${member.levelName}">普通</span>
                                        <span class="hint" th:text="'（折扣 ' + ${member.levelDiscount} + '）'"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="hint">余额</td>
                                    <td>
                                        <strong th:classappend="${member.balance.signum() > 0} ? 'text-success' : 'text-danger'"
                                                th:text="${#numbers.formatDecimal(member.balance, 1, 2)} + ' 元'">0.00 元</strong>
                                        <span th:if="${member.deposit.signum() > 0}" class="hint"
                                              th:text="'（另有冻结押金 ' + ${#numbers.formatDecimal(member.deposit, 1, 2)} + ' 元）'"></span>
                                    </td>
                                </tr>
                                <tr th:if="${member.status == 0}">
                                    <td class="hint">状态</td>
                                    <td><span class="badge-soft bs-red">账户已冻结</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card-box">
                        <h6>步骤二：选择空闲机位并开台</h6>

                        <div th:if="${member == null}" class="empty">
                            请先在左侧查询会员卡号
                        </div>

                        <div th:if="${member != null}">
                            <div th:if="${#lists.isEmpty(freeSeats)}" class="empty">
                                当前没有空闲机位
                            </div>

                            <form method="post" th:action="@{/cashier/open-seat}" th:unless="${#lists.isEmpty(freeSeats)}"
                                  onsubmit="return confirm('确认为该会员开台？');">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="cardNo" th:value="${member.cardNo}">

                                <div class="mb-3">
                                    <label class="form-label">空闲机位（共 <span th:text="${#lists.size(freeSeats)}">0</span> 台）</label>
                                    <div class="seat-board">
                                        <label th:each="s : ${freeSeats}" class="seat-cell seat-free"
                                               style="cursor:pointer;margin:0">
                                            <input type="radio" name="seatId" th:value="${s.id}"
                                                   required style="display:none" class="seat-radio">
                                            <div class="no" th:text="${s.seatNo}">A01</div>
                                            <div class="st" th:text="${s.area}">普通区</div>
                                        </label>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary">确认开台</button>
                                <span class="hint ms-2">开台后机位立即变为「使用中」，并开始计时。</span>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    // 点击机位卡片即选中对应单选按钮，并高亮显示
    document.querySelectorAll('.seat-radio').forEach(function (r) {
        r.addEventListener('change', function () {
            document.querySelectorAll('.seat-cell').forEach(function (c) {
                c.style.outline = '';
                c.style.outlineOffset = '';
            });
            var cell = this.closest('.seat-cell');
            cell.style.outline = '2px solid #185fa5';
            cell.style.outlineOffset = '1px';
        });
    });
    document.querySelectorAll('.seat-cell').forEach(function (c) {
        c.addEventListener('click', function () {
            var r = this.querySelector('.seat-radio');
            if (r) { r.checked = true; r.dispatchEvent(new Event('change')); }
        });
    });
</script>
</body>
</html>
