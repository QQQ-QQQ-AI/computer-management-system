<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('充值办理')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout/base :: sidebar('cashier','recharge')}"></aside>
    <div class="main">
        <div th:replace="~{layout/base :: topbar('充值办理')}"></div>
        <div class="content">
            <div th:replace="~{layout/base :: flash}"></div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <div class="row g-3">
                <div class="col-lg-6">
                    <div class="card-box">
                        <h6>现金充值</h6>

                        <form method="get" th:action="@{/cashier/recharge}" class="mb-3">
                            <label class="form-label">查询会员</label>
                            <div class="input-group">
                                <input type="text" class="form-control" name="cardNo"
                                       th:value="${cardNo}" placeholder="扫描或输入会员卡号" required>
                                <button type="submit" class="btn btn-outline-primary">查询</button>
                            </div>
                        </form>

                        <div th:if="${member != null}">
                            <div class="mb-3 p-3" style="background:#fafbfc;border-radius:8px">
                                <div style="font-size:15px;font-weight:500" th:text="${member.name}">姓名</div>
                                <div class="hint" th:text="${member.cardNo} + ' · ' + ${member.levelName}">卡号</div>
                                <div class="mt-2">
                                    当前余额
                                    <strong style="font-size:18px;color:#185fa5"
                                            th:text="${#numbers.formatDecimal(member.balance, 1, 2)}">0.00</strong>
                                    元
                                </div>
                            </div>

                            <form method="post" th:action="@{/cashier/recharge}"
                                  onsubmit="return confirm('确认收到现金并完成充值？');">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="cardNo" th:value="${member.cardNo}">

                                <div class="mb-3">
                                    <label class="form-label">快捷金额</label>
                                    <div class="d-flex gap-2 flex-wrap">
                                        <button type="button" class="btn btn-sm btn-outline-primary quick" data-v="50">50</button>
                                        <button type="button" class="btn btn-sm btn-outline-primary quick" data-v="100">100</button>
                                        <button type="button" class="btn btn-sm btn-outline-primary quick" data-v="200">200</button>
                                        <button type="button" class="btn btn-sm btn-outline-primary quick" data-v="300">300</button>
                                        <button type="button" class="btn btn-sm btn-outline-primary quick" data-v="500">500</button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="amount">充值金额（元）</label>
                                    <input type="number" class="form-control" id="amount" name="amount"
                                           step="0.01" min="0.01" required placeholder="请输入实收现金金额">
                                </div>

                                <button type="submit" class="btn btn-primary">确认充值</button>
                            </form>
                        </div>

                        <div th:if="${member == null}" class="empty">请先查询会员卡号</div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card-box">
                        <h6>交接班对账</h6>
                        <table class="table table-sm mb-0">
                            <tbody>
                            <tr>
                                <td>
                                    本人今日经办现金充值
                                    <div class="hint" style="font-size:11.5px">用于核对本班次现金箱金额</div>
                                </td>
                                <td class="text-end">
                                    <strong style="font-size:16px;color:#185fa5"
                                            th:text="${#numbers.formatDecimal(myCashRecharge, 1, 2)} + ' 元'">0.00 元</strong>
                                </td>
                            </tr>
                            <tr>
                                <td class="hint">全店今日充值总额（含线上，仅供参考）</td>
                                <td class="text-end hint"
                                    th:text="${#numbers.formatDecimal(today.rechargeAmount, 1, 2)} + ' 元'">0.00 元</td>
                            </tr>
                            <tr>
                                <td class="hint">全店今日营业收入</td>
                                <td class="text-end hint"
                                    th:text="${#numbers.formatDecimal(today.totalRevenue, 1, 2)} + ' 元'">0.00 元</td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="hint mt-3 pt-3" style="border-top:1px dashed #e5e7eb;line-height:2">
                            · 充值会写入「充值记录」并同时生成一条<strong>账户流水</strong>，<br>
                            　经办人自动记录为当前登录的收银员。<br>
                            · <strong>充值金额属于预收款，不计入营业收入</strong> ——<br>
                            　顾客还没消费，钱只是预存在账户里。<br>
                            · 每笔余额变动都有流水留痕，可随时按流水重算余额核对。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    document.querySelectorAll('.quick').forEach(function (b) {
        b.addEventListener('click', function () {
            document.getElementById('amount').value = this.dataset.v;
        });
    });
</script>
</body>
</html>
